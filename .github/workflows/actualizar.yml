name: Actualización diaria de la página

# Cada madrugada (05:17 en Ecuador) trae de Google la nota, el número de opiniones y las reseñas más recientes.
# También se puede correr a mano: pestaña Actions → "Actualización diaria de la página" → Run workflow.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-pagina
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Traer las reseñas de Google
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python3 scripts/actualizar.py
      - name: Guardar los cambios en la página
        run: |
          git config user.name "Frutireex (actualización diaria)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -m "Actualización diaria: reseñas de Google"
            git push
          fi
