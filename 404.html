<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Fruti Reex</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Outfit:wght@500;700&family=Yellowtail&display=swap">
<style>
  :root{--green:#044E33;--deep:#02301F;--lime:#CEE85D;--cream:#F1EDE2;--pink:#FFA4D6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--deep);color:var(--cream);font:500 17px/1.5 "Outfit",system-ui,sans-serif;text-align:center;padding:24px}
  main{max-width:520px;display:grid;justify-items:center;gap:14px}
  img{width:min(60vw,240px);height:auto;filter:drop-shadow(0 20px 26px rgb(0 0 0 / .35))}
  h1{margin:6px 0 0;font:900 clamp(1.9rem,6vw,3rem)/.95 "Archivo",sans-serif;font-stretch:125%;text-transform:uppercase}
  .script{font-family:"Yellowtail",cursive;color:var(--pink);font-size:clamp(1.6rem,5vw,2.2rem);line-height:1}
  p{margin:0;color:rgb(241 237 226 / .8)}
  a{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border-radius:999px;background:var(--lime);color:var(--deep);font-weight:700;text-decoration:none;margin-top:10px}
  a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/rex-brazos.webp" alt="El Tío Rex con los brazos cruzados">
  <h1>Esta página no existe</h1>
  <span class="script">el Tío se la comió</span>
  <p>Seguro buscabas una malcriada. Vuelve al inicio y elige la tuya.</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
